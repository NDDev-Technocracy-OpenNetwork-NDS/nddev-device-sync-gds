[package]
name = "nddev-device-sync-gds"
version = "0.0.1-alpha.7"
edition = "2024"
rust-version = "1.99"
license = "AGPL-3.0-only"
authors = ["NDDev OpenNetwork"]
homepage = "https://nddev.ai"
repository = "https://github.com/NDDev-Technocracy-OpenNetwork-NDS/nddev-device-sync-gds"

[features]
catalog-runtime = ["github-catalog", "dep:nddev-device-sync-accounts", "dep:nddev-device-sync-vault", "dep:uuid"]
browser-bindings = ["catalog-runtime", "dep:tsify", "nddev-device-sync-accounts/browser-bindings", "nddev-device-sync-vault/browser-bindings"]
default = []
commit-sync = ["dep:base64", "dep:zeroize", "dep:tokio", "dep:tokio-util", "dep:tracing", "dep:nddev-device-sync-telemetry", "dep:tempfile", "dep:uuid"]
github-catalog = ["dep:zeroize", "dep:tokio", "dep:tokio-util", "dep:tracing", "dep:url", "dep:nddev-device-sync-telemetry", "dep:reqwest", "dep:rustls", "dep:wasm-bindgen", "dep:wasm-bindgen-futures", "dep:js-sys", "dep:gloo-timers", "dep:web-sys"]

[dependencies]
nddev-device-sync-accounts = { git = "https://github.com/NDDev-Technocracy-OpenNetwork-NDS/nddev-device-sync-accounts", rev = "ae1af64c79c311fb0125e22f1f15966bf2ed218b", optional = true }
nddev-device-sync-vault = { git = "https://github.com/NDDev-Technocracy-OpenNetwork-NDS/nddev-device-sync-vault", rev = "41cc02df9dadccb00b7512627c3ca63b1824f694", optional = true }
uuid = { version = "1.27", features = ["v4"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = { version = "0.23", optional = true }
zeroize = { version = "1.8", optional = true }
tokio = { version = "1.53", features = ["macros", "sync"], optional = true }
tokio-util = { version = "0.7", features = ["rt"], optional = true }
tracing = { version = "0.1", optional = true }
url = { version = "2.5", optional = true }
nddev-device-sync-telemetry = { version = "=0.0.1-alpha.11", git = "https://github.com/NDDev-Technocracy-OpenNetwork-NDS/nddev-device-sync-observability", rev = "32f21f8a8f9c313bee9dcd1769c042133b5520da", optional = true }
nddev-device-sync-domain = { version = "=0.0.12", git = "https://github.com/NDDev-Technocracy-OpenNetwork-NDS/nddev-device-sync-core.git", rev = "e052fa0ee00bde55cda24746df2dc07f6ed996e7" }
nddev-device-sync-application = { version = "=0.0.1-alpha.21", git = "https://github.com/NDDev-Technocracy-OpenNetwork-NDS/nddev-device-sync-core.git", rev = "e052fa0ee00bde55cda24746df2dc07f6ed996e7" }

[target.'cfg(any(target_os = "linux", target_os = "macos", target_os = "windows"))'.dependencies]
nddev-device-sync-adapter-io = { version = "=0.0.1-alpha.4", git = "https://github.com/NDDev-Technocracy-OpenNetwork-NDS/nddev-device-sync-agent", rev = "a45a0d980d1e39260dfc7e6d6cbda55b02991d35" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { version = "0.13.3", default-features = false, features = ["rustls-no-provider", "gzip"], optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }
tokio = { version = "1.53", features = ["time"], optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
tsify = { version = "=0.5.8", default-features = false, features = ["js"], optional = true }
uuid = { version = "1.27", features = ["js"], optional = true }
wasm-bindgen = { version = "=0.2.129", optional = true }
wasm-bindgen-futures = { version = "=0.4.79", optional = true }
js-sys = { version = "=0.3.106", optional = true }
gloo-timers = { version = "0.4", features = ["futures"], optional = true }
web-sys = { version = "=0.3.106", features = ["Window", "Request", "RequestInit", "RequestMode", "RequestCredentials", "RequestRedirect", "RequestCache", "ReferrerPolicy", "Headers", "Response", "AbortController", "AbortSignal", "ReadableStream", "ReadableStreamDefaultReader"], optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
gix = { version = "=0.89.0", default-features = false, features = ["status", "revision", "sha1"] }
rustix = { version = "1.1", features = ["process", "fs"] }

[target.'cfg(target_os = "macos")'.dependencies]
rustix = { version = "1.1", features = ["fs"] }

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
tempfile = { version = "3", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
flate2 = "1"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "net", "io-util", "signal"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
nddev-device-sync-accounts = { git = "https://github.com/NDDev-Technocracy-OpenNetwork-NDS/nddev-device-sync-accounts", rev = "ae1af64c79c311fb0125e22f1f15966bf2ed218b", features = ["development-http"] }
nddev-device-sync-vault = { git = "https://github.com/NDDev-Technocracy-OpenNetwork-NDS/nddev-device-sync-vault", rev = "41cc02df9dadccb00b7512627c3ca63b1824f694", features = ["development-http"] }

[lints.rust]
unsafe_code = "forbid"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "=0.3.79"
