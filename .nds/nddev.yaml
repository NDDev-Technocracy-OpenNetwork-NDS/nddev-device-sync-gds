# std-0001 repository manifest — schema: `nddev schema manifest`.
apiVersion: nddev.ai/v1alpha3
kind: Repository
metadata:
  id: nddev-device-sync-gds
  locator: github:NDDev-Technocracy-OpenNetwork-NDS/nddev-device-sync-gds
  owner: rldyourmnd
spec:
  standard:
    id: std-0001
    version: 3.0.0
  role: component
  profiles:
  - rust
  system:
    id: nds
    root: github:NDDev-Technocracy-OpenNetwork-NDS/nddev-device-sync
  portfolios:
  - portfolio:nddev-technocracy-opennetwork-nds
  consumes:
  - contract: nddev-device-sync-accounts/accounts
    via: Cargo.toml
  variations:
  - paths: [.gds]
    purpose: config
    reason: GDS estate metadata is owned by the GDS engine, not std-0001 tooling.
    decision: {state: approved, by: rldyourmnd, date: "2026-10-22", origin: document, reference: standarts/decisions/0013-estate-hygiene-and-standards-adoption.md}
  - paths: [module.yaml]
    purpose: manifest
    reason: NDS module descriptor owned by the product standards corpus.
    decision: {state: approved, by: rldyourmnd, date: "2026-10-22", origin: document, reference: standarts/decisions/0013-estate-hygiene-and-standards-adoption.md}
  - paths: [standarts.lock]
    purpose: lock
    reason: NDS contract lock pinning the standards source.
    decision: {state: approved, by: rldyourmnd, date: "2026-10-22", origin: document, reference: standarts/decisions/0013-estate-hygiene-and-standards-adoption.md}
  - paths: [contracts]
    purpose: manifest
    reason: NDS compiled-in runtime manifest directory owned by the module.
    decision: {state: approved, by: rldyourmnd, date: "2026-10-22", origin: document, reference: standarts/decisions/0013-estate-hygiene-and-standards-adoption.md}
  - paths: [scripts]
    purpose: tool-config
    reason: Native provider acceptance scripts owned by the repository.
    decision: {state: approved, by: rldyourmnd, date: "2026-10-22", origin: document, reference: standarts/decisions/0013-estate-hygiene-and-standards-adoption.md}
  modules:
  - .
  adapters:
  - claude
  - cursor
