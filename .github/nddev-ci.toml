schema = 1
profiles = ["rust"]

[tools.rust]
command = ["rustc", "--version"]
pattern = "^rustc 1[.]99[.]1"

[commands.rust]
lint = ["cargo", "clippy", "--locked", "--workspace", "--all-targets", "--", "-D", "warnings"]
test = ["cargo", "test", "--locked", "--workspace"]
build = ["cargo", "build", "--locked", "--workspace", "--release"]
policy = ["cargo", "deny", "--locked", "check", "licenses", "sources"]

[timeouts]
rust = 900

[extras.fleet-harness]
purpose = "Check native fleet artifact source/profile integrity and refusal before fixture effects"
command = ["python3", "-B", "-m", "unittest", "discover", "-s", "scripts", "-p", "test_*.py"]
timeout = 60

[extras.advisories]
purpose = "Check the locked dependencies against current RustSec advisories"
command = ["cargo", "audit", "--deny", "warnings"]
timeout = 600

[extras.github-catalog]
purpose = "Lint and test the optional github-catalog feature"
command = ["cargo", "test", "--locked", "--features", "github-catalog"]
timeout = 600

[extras.commit-sync]
purpose = "Run the owning all-feature tests, including catalog and commit synchronization"
command = ["cargo", "test", "--locked", "--all-features"]
timeout = 600

[extras.wasm-gate]
purpose = "Browser bindings compile for wasm32-unknown-unknown"
command = ["cargo", "check", "--locked", "--lib", "--features", "browser-bindings", "--target", "wasm32-unknown-unknown"]
timeout = 600
