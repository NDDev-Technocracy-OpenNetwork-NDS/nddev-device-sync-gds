name: GitHub commit acceptance

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-commit-acceptance
  cancel-in-progress: false

env:
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  github-commits:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal
      - name: Restore the Cargo dependency and tool cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: github-commits
          add-job-id-key: "false"
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install Linux credential-store build inputs
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libsecret-1-dev pkg-config
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.15.1'
      - name: Check fixture authority guards
        run: python3 -B -m unittest discover -s scripts -p test_github_commits.py
      - name: Compile acceptance before lending its credential
        run: cargo test --locked --features github-catalog,commit-sync --test github_commits --no-run --message-format=json > "$RUNNER_TEMP/nds-github-test.jsonl"
      - name: Qualify actual GitHub metadata and existing commits
        run: python3 scripts/check-github-commits.py run "$RUNNER_TEMP/nds-github-test.jsonl"
        env:
          NDS_GITHUB_ACCEPTANCE_TOKEN: ${{ github.token }}
          NDS_GITHUB_REPOSITORY_ID: ${{ github.repository_id }}
          NDS_GITHUB_OWNER_ID: ${{ github.repository_owner_id }}
      - name: Confirm owned branch cleanup
        if: always()
        run: python3 scripts/check-github-commits.py cleanup "$RUNNER_TEMP/nds-github-test.jsonl"
        env:
          NDS_GITHUB_ACCEPTANCE_TOKEN: ${{ github.token }}
