name: NDS checks
on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pinned Rust
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt,clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Module tests and Linux Rust worker acceptance
        run: cargo test --locked --workspace
      - name: Catalog and existing-commit native acceptance
        run: |
          cargo clippy --locked --all-targets --features github-catalog,commit-sync -- -D warnings
          cargo test --locked --features github-catalog,commit-sync
      - name: Catalog WASM code check (not browser runtime acceptance)
        if: runner.os == 'Linux'
        run: |
          rustup target add wasm32-unknown-unknown --toolchain 1.99.1
          cargo check --locked --lib --features github-catalog --target wasm32-unknown-unknown
      - name: Dependency policy and advisory checks
        if: runner.os == 'Linux'
        run: |
          cargo install --locked --version 0.20.2 cargo-deny
          cargo install --locked --version 0.22.2 cargo-audit
          cargo deny check
          cargo audit
