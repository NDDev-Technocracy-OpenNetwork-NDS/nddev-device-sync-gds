name: main-ci

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: main-validation
  cancel-in-progress: false

env:
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  contract:
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt,clippy --target wasm32-unknown-unknown
      - name: Restore the Cargo dependency and tool cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: native-contract
          add-job-id-key: "false"
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install Linux credential-store build inputs
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libsecret-1-dev pkg-config
      - name: Install pinned quality tools
        uses: NDDev-Technocracy-Standarts/std-0004-ci-cd-workflows/.github/actions/tools@365415f32190ae22ff22462e791a4829ad6e91fc # nddev-cicd-v0.6.16
        with:
          # cargo-audit 0.22.2, cargo-deny 0.20.2 and cargo-nextest 0.9.149 from checksummed
          # releases instead of compiling them with cargo install in every job.
          capability: rust
      - name: Run the STD-0004 native Rust contract
        id: native
        uses: NDDev-Technocracy-Standarts/std-0004-ci-cd-workflows/.github/actions/ci@a77e385fcf3c1b000c38167ecac7b74bb7715b10 # std-0004-v0.3.1
      - name: Require complete native results
        if: ${{ !cancelled() }}
        env:
          STATUS: ${{ steps.native.outputs.status }}
        run: test "$STATUS" = success
      - name: Run the RustSec advisory audit
        run: cargo audit --deny warnings

  matrix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pinned Rust
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt,clippy
      - name: Install Linux credential-store build inputs
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libsecret-1-dev pkg-config
      - name: Format
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Module tests and Linux Rust worker acceptance
        run: cargo test --locked --workspace
      - name: Lint the native macOS commit-sync adapter
        if: runner.os == 'macOS'
        run: cargo clippy --locked --all-targets --features commit-sync -- -D warnings
      - name: Qualify native macOS Git ownership and preservation
        if: runner.os == 'macOS'
        run: cargo test --locked --features commit-sync --lib commits::tests -- --test-threads=2
